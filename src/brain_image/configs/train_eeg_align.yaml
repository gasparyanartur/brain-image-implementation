defaults:
  - base
  - dataset: eeg_dataset
  - model: eeg_model
  - trainer: eeg_trainer
  - _self_

model:
  do_align: true
  do_recon: false
  do_recon_low: false

  encoder_lr: 3e-4
  encoder_min_lr: 1e-5
  encoder_warmup_epochs: 1

  modules_to_train:
    - eeg_encoder

  max_epochs: 40

trainer:
  checkpoint_monitor_early_stop: 10

dataset:
  batch_size: 512
  val_batch_size: 256
  test_batch_size: 256

checkpoint_path: null
resume_training: false