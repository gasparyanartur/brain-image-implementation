defaults:
  - base
  - dataset: eeg_dataset
  - model: low_level_model
  - trainer: low_level_trainer
  - _self_

checkpoint_path: null
resume_training: false

model:
  seed: 42
  max_epochs: 500

trainer:
  checkpoint_monitor_early_stop: 150
  check_val_every_n_epochs: 10

dataset:
  batch_size: 256
  val_batch_size: 256
  test_batch_size: 256