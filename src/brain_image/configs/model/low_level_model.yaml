
defaults:
  - /eeg_encoder@eeg_encoder: atms
  - _self_
vae_encoder: "ip_sdxl_turbo_128"

use_perceptual_loss: false
#perceptual_loss_model: "synclr_vitb16"
perceptual_loss_model: "lpips"

encoder_lr: 3e-4
encoder_min_lr: 1e-6
low_level_lr: 3e-4
low_level_min_lr: 1e-6
lr_warmup_epochs: 1

lr_scheduler: "cosine_anneal"
betas: [0.9, 0.999]

max_epochs: 500
metric_log_epochs: 10
run_validation_reconstruction_metrics: false
test_recon_metrics: [pixcorr, ssim, alex2, alex5, inceptionv3, clip, efficientnet, swav]
eval_batch_size: 16

highlighted_recons:
  - 161  # Seaweed
  - 143  # Pug
  - 158  # Scallop
  - 166  # Slide
  - 65  # Dreidel
  - 127  # Pajamas
  - 100  # Jelly Beans
  - 141  # Possum
  - 198  # Wine
