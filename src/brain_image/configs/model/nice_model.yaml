# NICE Model Configuration

# Model architecture and reconstruction settings
#align_target_model: "unaligned_synclr_vitb16"
align_target_model: "clip_vith14"
low_recon_model: "sd_variations_v2"
#high_recon_model: "clip_vitl14"
high_recon_model: "clip_vith14"
#eeg_encoder_model: "nice"
eeg_encoder_model: "atms"

do_align: true
do_high_recon: false
do_low_recon: false
prior_debug_mode: false
log_gradients: false

align_loss_type: clip

#project_dim: 768
project_dim: 1024
eeg_latent_dim: 1440
#img_latent_dim: 768
img_latent_dim: 1024

skip_eval_first_epoch: true
full_eval_every_epochs: 1

encoder_lr: 3e-4
encoder_min_lr: 1e-5
encoder_warmup_epochs: 1
encoder_delay_epochs: 0

prior_lr: 3e-4
prior_min_lr: 1e-6
prior_warmup_epochs: 1
prior_delay_epochs: 0

lr_scheduler: "cosine_anneal"
betas: [0.9, 0.999]

warmup_start_frac: 0.02
max_epochs: 50

temperature_init: 0.07
data_seed: 42