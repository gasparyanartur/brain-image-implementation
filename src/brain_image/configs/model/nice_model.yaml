# NICE Model Configuration

# Model architecture and reconstruction settings
align_target_model: "unaligned_synclr_16"
low_recon_model: "sd_lowlevel"
high_recon_model: "sd_highlevel"
do_align: true
do_high_recon: true
do_low_recon: false
do_prior: true

# Projection dimensions
project_dim: 768
eeg_latent_dim: 1440
img_latent_dim: 768
project_image: false

skip_recon_first_epoch: false

# Learning rate settings
encoder_lr: 1e-3
encoder_min_lr: 1e-5
encoder_warmup_epochs: 1
encoder_delay_epochs: 0

projector_lr: 5e-4
projector_min_lr: 1e-5
projector_warmup_epochs: 1
projector_delay_epochs: 0

prior_lr: 5e-4
prior_min_lr: 1e-5
prior_warmup_epochs: 1
prior_delay_epochs: 0

embed_adapter_lr: 3e-4
embed_adapter_min_lr: 1e-5
embed_adapter_warmup_epochs: 1
embed_adapter_delay_epochs: 1

prior_adapter_lr: 3e-4
prior_adapter_min_lr: 1e-5
prior_adapter_warmup_epochs: 1
prior_adapter_delay_epochs: 1

lr_scheduler: "cosine_anneal"
betas: [0.9, 0.999]

# Training schedule
warmup_start_frac: 0.2
max_epochs: 100

recon_every_epochs: 1

# Model parameters
temperature_init: 0.04
data_seed: 42

prior_debug_mode: false

log_gradients: false