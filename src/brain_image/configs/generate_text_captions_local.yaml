defaults:
  - base
  - dataset: things-eeg2
  - _self_

splits:
  - train
  - test

caption_path: data/things-eeg2/captions/local.jsonl
model_name: Qwen/Qwen2.5-VL-7B-Instruct
batch_size: 32
dtype: bfloat16
device: null
max_new_tokens: 512

system_prompt: >
  You are given an image, followed by a label. 
  Generate a single, detailed caption for the image, with emphasis on visual details of the object matching the label. 
  Describe the object's appearance, color, shape, and any distinctive features, as well as the context in which it is found.
  Avoid generic descriptions and focus on specific visual attributes that make the object identifiable.
  Be concise but informative, ensuring the caption provides a clear mental image of the object based on its visual characteristics.

dataset:
  subs: [1]
