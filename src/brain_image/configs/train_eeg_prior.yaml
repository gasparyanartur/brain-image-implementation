defaults:
  - train_eeg
  - override augmentation: eeg
  - _self_

model:
  do_align: false
  do_recon: true
  do_recon_low: false
  skip_reconstruction: true
  skip_eval_first_epoch: false

  # Initialize the EEG encoder from the completed best alignment run. The
  # checkpoint loader extracts only the `eeg_encoder.*` weights.
  eeg_encoder_path: experiments/eeg_alignment_sweep/20260830_231325_task4/train_eeg-20260830_231357/version_0/checkpoints/epoch_0089-val_align_top1_0.7650.ckpt

  encoder_lr: 1e-3
  encoder_min_lr: 1e-7
  encoder_warmup_epochs: 5
  encoder_delay_epochs: 0

  align_img_encoder: "aligned_synclr_vitb16"

  modules_to_train:
    - eeg_encoder
    - prior

  prior_lr: 1e-3
  prior_min_lr: 1e-7
  prior_warmup_epochs: 5
  prior_delay_epochs: 0
  

  max_epochs: 500
  #max_epochs: 150

  full_eval_every_epochs: 5

trainer:
  checkpoint_monitor: "eval/val/prior/pred_cos"
  checkpoint_monitor_mode: "max"
  checkpoint_monitor_early_stop: 150
  check_val_every_n_epochs: 5

dataset:
  batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  num_workers: 4
