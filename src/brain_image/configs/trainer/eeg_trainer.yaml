defaults:
  - /wandb: wandb
  - _self_

run_name: "train_eeg"

compile_model: true
init_weights: true
debug_mode: false

dtype: "float32"

log_dir: logs
checkpoint_dir: null
enable_barebones: false
checkpoint_monitor: "val/loss"
checkpoint_monitor_mode: "min"
checkpoint_monitor_early_stop: 20

overfit_batches: 0

val_check_interval: 1.0
log_every_n_steps: 50
enable_progress_bar: true
enable_model_summary: true
save_checkpoints: true
save_top_k: 1

accelerator: "auto" 